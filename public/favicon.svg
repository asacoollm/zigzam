<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="zg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AFF"/>
      <stop offset="1" stop-color="#FF4D8D"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#zg)"/>

  <!-- Bonhomme Fall Guys vert, bras levés, qui tient le Z -->
  <g>
    <path d="M40 63 Q27 52 24 38" stroke="#3DD68C" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M60 63 Q73 52 76 38" stroke="#3DD68C" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="24" cy="38" r="6" fill="#3DD68C"/>
    <circle cx="76" cy="38" r="6" fill="#3DD68C"/>

    <rect x="34" y="60" width="32" height="33" rx="16" fill="#3DD68C"/>
    <ellipse cx="42" cy="94" rx="7" ry="4.5" fill="#ffffff"/>
    <ellipse cx="58" cy="94" rx="7" ry="4.5" fill="#ffffff"/>

    <circle cx="43" cy="72" r="2.6" fill="#2b2350"/>
    <circle cx="57" cy="72" r="2.6" fill="#2b2350"/>
    <path d="M42 79 Q50 84 58 79" stroke="#2b2350" stroke-width="2.1" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Z blanc, grand, penché -->
  <text x="50" y="30" text-anchor="middle" dominant-baseline="central"
        font-family="Trebuchet MS, Verdana, Arial, sans-serif"
        font-size="52" font-weight="800" fill="#ffffff"
        transform="rotate(-8 50 30)">Z</text>
</svg>
